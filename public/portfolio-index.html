<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Mobility Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0908;--surface:#151311;--text:#EDE8E0;--sub:#8A8680;
  --red:#D1292E;--cyan:#3B8B8A;
  --gf:rgba(237,232,224,0.04);--gb:rgba(237,232,224,0.12);
  --ease:cubic-bezier(0.65,0,0.35,1);
  --pad-x:clamp(20px,4vw,60px);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-weight:300;overflow-x:hidden;cursor:auto;min-height:100vh}
body.has-mouse{cursor:none}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:160px;opacity:0.042;
}

/* ── CURSOR ─────────────────────────────────────────────────── */
#cursor{
  position:fixed;border-radius:50%;pointer-events:none;z-index:9998;
  transform:translate(-50%,-50%);
  background:var(--gf);border:1px solid var(--gb);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  width:44px;height:44px;
  transition:width .3s var(--ease),height .3s var(--ease),backdrop-filter .3s var(--ease),opacity .25s;
  opacity:0;display:none;
}
body.has-mouse #cursor{display:block}
body.has-mouse #cursor.cursor-visible{opacity:1}
#cursor.hovering{width:72px;height:72px;backdrop-filter:blur(28px) saturate(200%);-webkit-backdrop-filter:blur(28px) saturate(200%)}
#cursor.card-hover{
  width:24px;height:24px;
  backdrop-filter:blur(4px) saturate(100%);
  -webkit-backdrop-filter:blur(4px) saturate(100%);
  border-color:rgba(237,232,224,0.3);
}
#cursor.filter-hover{
  width:16px;height:16px;
  backdrop-filter:blur(3px) saturate(90%);
  -webkit-backdrop-filter:blur(3px) saturate(90%);
  border-color:rgba(59,139,138,0.5);
  background:rgba(59,139,138,0.06);
}

/* ── NAV ─────────────────────────────────────────────────────── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  padding:26px var(--pad-x);display:flex;justify-content:space-between;align-items:center;
  background:rgba(10,9,8,0.72);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--gb);
}
.nav-logo{font-family:'Playfair Display',serif;font-size:18px;letter-spacing:.04em;color:var(--text);text-decoration:none}
.nav-links{display:flex;gap:44px;list-style:none}
.nav-links a{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--sub);text-decoration:none;transition:color .2s;position:relative;
}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;right:100%;height:1px;background:var(--cyan);transition:right .3s var(--ease)}
.nav-links a:hover{color:var(--text)}
.nav-links a:hover::after{right:0}
.nav-links a.active{color:var(--text)}
.nav-links a.active::after{right:0}

/* ── PAGE WRAPPER ───────────────────────────────────────────── */
.page{padding:120px var(--pad-x) 100px;max-width:1400px;margin:0 auto}

/* ── PAGE HEADER ────────────────────────────────────────────── */
.page-header{margin-bottom:64px}
.page-header-label{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);
  margin-bottom:18px;
}
.page-header-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(36px,4vw,58px);font-weight:400;line-height:1.05;
  margin-bottom:12px;
}
.page-header-count{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:.12em;color:var(--sub);text-transform:uppercase;
}
.page-header-count span{color:var(--text)}

/* ── FILTER BAR ──────────────────────────────────────────────── */
.filter-bar{
  margin-bottom:72px;
  display:flex;flex-direction:column;gap:16px;
}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-label{
  font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--sub);
  min-width:80px;
}
.filter-btn{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;
  color:var(--sub);background:transparent;
  border:1px solid var(--gb);
  padding:9px 20px;border-radius:2px;
  cursor:none;transition:color .25s var(--ease),border-color .25s var(--ease);
  position:relative;overflow:visible;
}
/* glass chip — tightly sized to text, expands from center */
.filter-btn::before{
  content:'';
  position:absolute;
  top:50%;left:50%;
  width:calc(100% - 10px);
  height:calc(100% - 10px); /* hugs text height */
  transform:translate(-50%,-50%) scaleX(0.35);
  background:rgba(237,232,224,0.05);
  backdrop-filter:blur(18px) saturate(200%);
  -webkit-backdrop-filter:blur(18px) saturate(200%);
  border:1px solid rgba(237,232,224,0.18);
  border-radius:1px;
  opacity:0;
  transition:opacity .28s var(--ease),transform .32s var(--ease);
  pointer-events:none;z-index:0;
}
.filter-btn span{position:relative;z-index:1} /* keep text above glass */
.filter-btn:hover{color:var(--text);border-color:transparent}
.filter-btn:hover::before{opacity:1;transform:translate(-50%,-50%) scaleX(1)}
.filter-btn.active{
  color:var(--text);
  border-color:var(--cyan);
  background:rgba(59,139,138,0.08);
}
.filter-btn.active::before{opacity:0;transform:translate(-50%,-50%) scaleX(0.35)}
.filter-divider{
  width:1px;height:28px;background:var(--gb);margin:0 8px;
}
.filter-reset{
  font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--sub);background:transparent;border:none;
  cursor:none;transition:color .2s;padding:7px 0;
  text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--gb);
}
.filter-reset:hover{color:var(--text)}

/* ── GRID ────────────────────────────────────────────────────── */
.grid-section{margin-bottom:4px}
.grid-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
  margin-bottom:3px;
  align-items:start;
}

/* ── PROJECT CARD ────────────────────────────────────────────── */
.project-card{
  position:relative;overflow:hidden;
  background:var(--surface);
  aspect-ratio:4/5;
  cursor:none;
  transition:opacity .5s var(--ease),transform .5s var(--ease);
}
.project-card.hidden{
  opacity:0;pointer-events:none;
  transform:scale(0.97);
  position:absolute;/* take out of flow when hidden */
}

/* middle card offset */
.grid-row .project-card:nth-child(2){
  margin-top:60px;
}

/* Card background / visual */
.card-visual{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform .9s var(--ease);
}
.project-card:hover .card-visual{transform:scale(1.03)}

/* Glow ring on hover */
.card-glow{
  position:absolute;inset:-2px;
  border-radius:0;
  opacity:0;
  transition:opacity .4s var(--ease);
  background:transparent;
  box-shadow:
    inset 0 0 0 1px rgba(237,232,224,0.18),
    0 0 40px 8px rgba(237,232,224,0.06),
    0 0 80px 20px rgba(237,232,224,0.03);
  pointer-events:none;z-index:2;
}
.project-card:hover .card-glow{opacity:1}

/* Glass info panel — rises from bottom */
.card-glass{
  position:absolute;bottom:0;left:0;right:0;z-index:3;
  padding:28px 26px 24px;
  background:rgba(10,9,8,0.55);
  backdrop-filter:blur(32px) saturate(160%);
  -webkit-backdrop-filter:blur(32px) saturate(160%);
  border-top:1px solid rgba(237,232,224,0.1);
  transform:translateY(100%);
  transition:transform .38s var(--ease);
}
.project-card:hover .card-glass{transform:translateY(0)}

.card-year{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.16em;color:var(--cyan);text-transform:uppercase;
  margin-bottom:10px;
  opacity:0;transform:translateY(10px);
  transition:opacity .22s .05s,transform .22s .05s;
}
.project-card:hover .card-year{opacity:1;transform:translateY(0)}
.card-title{
  font-family:'Playfair Display',serif;font-size:22px;font-weight:400;
  margin-bottom:6px;line-height:1.2;
  opacity:0;transform:translateY(10px);
  transition:opacity .22s .12s,transform .22s .12s;
}
.project-card:hover .card-title{opacity:1;transform:translateY(0)}
.card-cat{
  font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--sub);
  opacity:0;transform:translateY(10px);
  transition:opacity .22s .19s,transform .22s .19s;
}
.project-card:hover .card-cat{opacity:1;transform:translateY(0)}

/* index label top-left always visible */
.card-index{
  position:absolute;top:18px;left:20px;z-index:4;
  font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:.18em;color:rgba(237,232,224,0.25);
  text-transform:uppercase;
}

/* mouse shine */
.card-shine{
  position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;
  background:radial-gradient(200px circle at var(--mx,50%) var(--my,50%),rgba(237,232,224,0.07),transparent 70%);
  transition:opacity .35s;
}
.project-card:hover .card-shine{opacity:1}

/* ── NO RESULTS ──────────────────────────────────────────────── */
.no-results{
  display:none;
  padding:100px 0;text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--sub);
}
.no-results.show{display:block}


/* ── RESPONSIVE ──────────────────────────────────────────────── */
@media (max-width:1024px){
  .grid-row{grid-template-columns:repeat(2,1fr)!important}
  .grid-row .project-card:nth-child(2){margin-top:0}
}
@media (max-width:768px){
  .nav-links{gap:18px}
  .nav-links a{font-size:10px;letter-spacing:.08em}
  .grid-row{grid-template-columns:1fr!important}
  .project-card{aspect-ratio:4/3}
  .filter-bar{margin-bottom:36px}
  .filter-row{gap:8px;flex-wrap:wrap}
  .filter-divider{display:none}
}
@media (max-width:430px){
  .nav-links li:last-child{display:none}
  .filter-label{min-width:auto;font-size:8px}
}
@media (hover:none){
  .card-glass{transform:translateY(0)!important}
  .card-year,.card-title,.card-cat{opacity:1!important;transform:translateY(0)!important}
  .filter-btn{cursor:pointer}
}
body.has-mouse .filter-btn,body.has-mouse .filter-reset{cursor:none}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .reveal{opacity:1;transform:none}
}

/* ── UTILS ───────────────────────────────────────────────────── */
@keyframes fadeup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.visible{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<div id="cursor"></div>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">M·D</a>
  <ul class="nav-links">
    <li><a href="#" class="active">Portfolio</a></li>
    <li><a href="#">3D Modeling</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<div class="page">

  <!-- PAGE HEADER -->
  <div class="page-header reveal">
    <p class="page-header-label">// Portfolio — Selected Works</p>
    <h1 class="page-header-title">Every line<br><em style="font-style:italic;color:var(--sub)">holds a decision.</em></h1>
    <p class="page-header-count">Showing <span id="visible-count">18</span> of 18 projects</p>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar reveal">
    <!-- Row 1: terrain -->
    <div class="filter-row">
      <span class="filter-label">Terrain</span>
      <button class="filter-btn" data-filter-terrain="on-road"><span>On-Road</span></button>
      <button class="filter-btn" data-filter-terrain="off-road"><span>Off-Road</span></button>
      <div class="filter-divider"></div>
      <button class="filter-reset" id="reset-all">Clear All</button>
    </div>
    <!-- Row 2: type -->
    <div class="filter-row">
      <span class="filter-label">Type</span>
      <button class="filter-btn" data-filter-type="sedan"><span>Sedan</span></button>
      <button class="filter-btn" data-filter-type="suv-wagon"><span>SUV / Wagon</span></button>
      <button class="filter-btn" data-filter-type="truck"><span>Truck</span></button>
      <button class="filter-btn" data-filter-type="mobility"><span>Mobility</span></button>
    </div>
  </div>

  <!-- GRID -->
  <div id="grid-container"></div>
  <p class="no-results" id="no-results">No projects match the selected filters.</p>

</div>

<script>
/* ══ PROJECT DATA (18 cards) ═══════════════════════════════════ */
const PROJECTS = [
  {id:'project-01',title:'RaidFrame DAKAR',year:'2026',cat:'Off-Road Mobility Concept',terrain:'off-road',type:'mobility',accent:'red',real:true,thumb:'images/raidframe-thumb.jpg' },
  {id:'p02',title:'Boundary 02',year:'2024',cat:'Autonomous Van',terrain:'on-road',type:'mobility',accent:'cyan'},
  {id:'p03',title:'Object 03',year:'2023',cat:'Product-Vehicle Crossover',terrain:'on-road',type:'sedan',accent:'red'},
  {id:'p04',title:'Silhouette 04',year:'2024',cat:'Sports Sedan',terrain:'on-road',type:'sedan',accent:'red'},
  {id:'p05',title:'Surface 05',year:'2023',cat:'Executive Wagon',terrain:'on-road',type:'suv-wagon',accent:'cyan'},
  {id:'p06',title:'Tension 06',year:'2024',cat:'Compact SUV',terrain:'on-road',type:'suv-wagon',accent:'red'},
  {id:'p07',title:'Ridge 07',year:'2024',cat:'Off-Road Utility',terrain:'off-road',type:'truck',accent:'cyan'},
  {id:'p08',title:'Terrain 08',year:'2023',cat:'All-Terrain SUV',terrain:'off-road',type:'suv-wagon',accent:'red'},
  {id:'p09',title:'Gorge 09',year:'2024',cat:'Overland Truck',terrain:'off-road',type:'truck',accent:'cyan'},
  {id:'p10',title:'Arc 10',year:'2023',cat:'City Mobility Pod',terrain:'on-road',type:'mobility',accent:'red'},
  {id:'p11',title:'Trace 11',year:'2024',cat:'Crossover Wagon',terrain:'on-road',type:'suv-wagon',accent:'cyan'},
  {id:'p12',title:'Line 12',year:'2023',cat:'Gran Turismo Sedan',terrain:'on-road',type:'sedan',accent:'red'},
  {id:'p13',title:'Mass 13',year:'2024',cat:'Off-Road Pickup',terrain:'off-road',type:'truck',accent:'cyan'},
  {id:'p14',title:'Crest 14',year:'2023',cat:'Dune Runner SUV',terrain:'off-road',type:'suv-wagon',accent:'red'},
  {id:'p15',title:'Draft 15',year:'2024',cat:'Last-Mile Mobility',terrain:'on-road',type:'mobility',accent:'cyan'},
  {id:'p16',title:'Block 16',year:'2023',cat:'Heavy-Duty Truck',terrain:'off-road',type:'truck',accent:'red'},
  {id:'p17',title:'Plane 17',year:'2024',cat:'Aerodynamic Sedan',terrain:'on-road',type:'sedan',accent:'cyan'},
  {id:'p18',title:'Ground 18',year:'2023',cat:'Expedition Vehicle',terrain:'off-road',type:'suv-wagon',accent:'red'},
];

/* ── Vehicle SVG variants per type ──────────────────────────── */
function vehicleSVG(type, accent, id, real, thumb) {
  if (real && thumb) return '';
  const a = accent === 'red' ? '#D1292E' : '#3B8B8A';
  const seed = parseInt(id.replace('p',''));

  // slight proportion variation per card
  const w = 340 + (seed % 5) * 8;
  const h = 155 + (seed % 4) * 6;
  const cx1 = 90 + (seed % 3) * 6;
  const cx2 = w - 90 - (seed % 3) * 6;
  const cy = h + 20;

  if (type === 'truck') {
    return `<svg width="82%" viewBox="0 0 380 200" fill="none" style="opacity:.52">
      <path d="M 50 145 L 50 100 L 90 80 L 200 78 L 320 80 L 350 95 L 355 145" stroke="#EDE8E0" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="38" y1="145" x2="358" y2="145" stroke="#EDE8E0" stroke-width="1.2"/>
      <line x1="200" y1="78" x2="200" y2="145" stroke="#8A8680" stroke-width=".6"/>
      <circle cx="95" cy="165" r="22" stroke="#EDE8E0" stroke-width="1.1" fill="none"/>
      <circle cx="95" cy="165" r="10" stroke="#6A6660" stroke-width=".7" fill="none"/>
      <circle cx="310" cy="165" r="22" stroke="#EDE8E0" stroke-width="1.1" fill="none"/>
      <circle cx="310" cy="165" r="10" stroke="#6A6660" stroke-width=".7" fill="none"/>
      <path d="M 55 115 L 350 113" stroke="${a}" stroke-width=".9" stroke-linecap="round"/>
    </svg>`;
  }
  if (type === 'sedan') {
    return `<svg width="82%" viewBox="0 0 380 180" fill="none" style="opacity:.52">
      <path d="M 42 140 C 32 136 26 124 28 108 C 30 94 42 83 68 76 C 94 70 130 67 160 66 L 220 66 C 260 66 300 70 326 82 C 346 92 354 110 350 140" stroke="#EDE8E0" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="30" y1="140" x2="354" y2="140" stroke="#EDE8E0" stroke-width="1.2"/>
      <circle cx="88" cy="160" r="22" stroke="#EDE8E0" stroke-width="1.1" fill="none"/>
      <circle cx="88" cy="160" r="10" stroke="#6A6660" stroke-width=".7" fill="none"/>
      <circle cx="300" cy="160" r="22" stroke="#EDE8E0" stroke-width="1.1" fill="none"/>
      <circle cx="300" cy="160" r="10" stroke="#6A6660" stroke-width=".7" fill="none"/>
      <path d="M 62 100 L 330 98" stroke="${a}" stroke-width=".9" stroke-linecap="round"/>
      <line x1="130" y1="66" x2="110" y2="140" stroke="#8A8680" stroke-width=".55"/>
      <line x1="265" y1="66" x2="278" y2="140" stroke="#8A8680" stroke-width=".55"/>
    </svg>`;
  }
  if (type === 'suv-wagon') {
    return `<svg width="82%" viewBox="0 0 380 190" fill="none" style="opacity:.52">
      <path d="M 48 148 C 36 143 28 130 30 112 C 32 97 46 88 72 82 C 98 77 140 75 200 75 L 270 75 C 308 75 336 82 350 96 C 360 107 362 128 358 148" stroke="#EDE8E0" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="35" y1="148" x2="360" y2="148" stroke="#EDE8E0" stroke-width="1.2"/>
      <circle cx="95" cy="168" r="22" stroke="#EDE8E0" stroke-width="1.1" fill="none"/>
      <circle cx="95" cy="168" r="10" stroke="#6A6660" stroke-width=".7" fill="none"/>
      <circle cx="308" cy="168" r="22" stroke="#EDE8E0" stroke-width="1.1" fill="none"/>
      <circle cx="308" cy="168" r="10" stroke="#6A6660" stroke-width=".7" fill="none"/>
      <path d="M 70 110 L 340 108" stroke="${a}" stroke-width=".9" stroke-linecap="round"/>
    </svg>`;
  }
  // mobility (default — van-like rounded)
  return `<svg width="82%" viewBox="0 0 380 190" fill="none" style="opacity:.52">
    <path d="M 55 148 C 40 143 30 130 32 112 C 34 98 48 89 72 83 C 96 77 150 75 200 75 C 250 75 304 77 330 89 C 350 99 358 118 355 148" stroke="#EDE8E0" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="42" y1="148" x2="358" y2="148" stroke="#EDE8E0" stroke-width="1.2"/>
    <circle cx="98" cy="168" r="22" stroke="#EDE8E0" stroke-width="1.1" fill="none"/>
    <circle cx="98" cy="168" r="10" stroke="#6A6660" stroke-width=".7" fill="none"/>
    <circle cx="308" cy="168" r="22" stroke="#EDE8E0" stroke-width="1.1" fill="none"/>
    <circle cx="308" cy="168" r="10" stroke="#6A6660" stroke-width=".7" fill="none"/>
    <path d="M 72 112 L 335 110" stroke="${a}" stroke-width=".9" stroke-linecap="round"/>
  </svg>`;
}

/* ── BG shades per card index ─────────────────────────────────── */
const BG_SHADES = [
  'linear-gradient(160deg,#0d0c0b,#161311)',
  'linear-gradient(160deg,#0c0d0b,#12140f)',
  'linear-gradient(160deg,#0d0b0b,#161210)',
  'linear-gradient(160deg,#0b0c0d,#101214)',
  'linear-gradient(160deg,#0d0d0b,#151510)',
  'linear-gradient(160deg,#0b0d0c,#101412)',
];

/* ── BUILD GRID ──────────────────────────────────────────────── */
const container = document.getElementById('grid-container');

function buildGrid(projects) {
  container.innerHTML = '';
  // chunk into rows of 3
  for (let r = 0; r < projects.length; r += 3) {
    const row = document.createElement('div');
    row.className = 'grid-row';
    const chunk = projects.slice(r, r + 3);
    chunk.forEach((p, colIdx) => {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.dataset.id = p.id;
      card.dataset.terrain = p.terrain;
      card.dataset.type = p.type;

      const globalIdx = r + colIdx;
      const shade = BG_SHADES[globalIdx % BG_SHADES.length];
      const numStr = String(r + colIdx + 1).padStart(2,'0');

      const svgContent = vehicleSVG(p.type, p.accent, p.id, p.real, p.thumb);
      const visualInner = p.real && p.thumb
        ? `<img src="${p.thumb}" alt="${p.title}" style="width:100%;height:100%;object-fit:cover;object-position:center;filter:grayscale(20%) contrast(1.1);">`
        : svgContent;
      card.innerHTML = `
        <div class="card-visual" style="background:${p.real && p.thumb ? '#0A0908' : shade}">
          ${visualInner}
        </div>
        <div class="card-index">${numStr}</div>
        <div class="card-glow"></div>
        <div class="card-shine"></div>
        <div class="card-glass">
          <p class="card-year">${p.year} — ${p.terrain === 'on-road' ? 'On-Road' : 'Off-Road'}</p>
          <h3 class="card-title">${p.title}</h3>
          <p class="card-cat">${p.cat}</p>
        </div>`;

      card.addEventListener('mouseenter', () => {
        cursor.classList.remove('hovering');
        cursor.classList.add('card-hover');
      });
      card.addEventListener('mouseleave', () => cursor.classList.remove('card-hover'));
      card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--mx', ((e.clientX-rect.left)/rect.width*100).toFixed(1)+'%');
        card.style.setProperty('--my', ((e.clientY-rect.top)/rect.height*100).toFixed(1)+'%');
      });
      card.addEventListener('click', () => {
        const dest = p.real ? `portfolio-detail-${p.id}.html` : `#`;
        if (p.real) window.location.href = dest;
      });
      if (p.real) card.style.cursor = 'none';

      row.appendChild(card);
    });
    container.appendChild(row);
  }
  updateCount(projects.length);
}

buildGrid(PROJECTS);

/* ── FILTER LOGIC ────────────────────────────────────────────── */
let activeTerrain = null;
let activeType = null;

function applyFilters() {
  const filtered = PROJECTS.filter(p => {
    const terrainOk = !activeTerrain || p.terrain === activeTerrain;
    const typeOk = !activeType || p.type === activeType;
    return terrainOk && typeOk;
  });
  buildGrid(filtered);
  document.getElementById('no-results').classList.toggle('show', filtered.length === 0);
}

function updateCount(n) {
  document.getElementById('visible-count').textContent = n;
}

document.querySelectorAll('[data-filter-terrain]').forEach(btn => {
  btn.addEventListener('click', () => {
    const val = btn.dataset.filterTerrain;
    if (activeTerrain === val) { activeTerrain = null; btn.classList.remove('active'); }
    else {
      activeTerrain = val;
      document.querySelectorAll('[data-filter-terrain]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    applyFilters();
  });
});

document.querySelectorAll('[data-filter-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    const val = btn.dataset.filterType;
    if (activeType === val) { activeType = null; btn.classList.remove('active'); }
    else {
      activeType = val;
      document.querySelectorAll('[data-filter-type]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    applyFilters();
  });
});

document.getElementById('reset-all').addEventListener('click', () => {
  activeTerrain = null; activeType = null;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  applyFilters();
});

/* ══ CURSOR ═══════════════════════════════════════════════════ */
const cursor = document.getElementById('cursor');
let cx=0,cy=0,tx=0,ty=0,hasMouse=false,rafId=null;
function lerp(a,b,t){return a+(b-a)*t}
function tick(){
  const dx=tx-cx,dy=ty-cy,speed=Math.sqrt(dx*dx+dy*dy);
  const stretch=Math.min(1+speed*.009,1.3),angle=Math.atan2(dy,dx)*180/Math.PI;
  cx=lerp(cx,tx,.12);cy=lerp(cy,ty,.12);
  cursor.style.left=cx+'px';cursor.style.top=cy+'px';
  cursor.style.transform=`translate(-50%,-50%) rotate(${angle}deg) scaleX(${stretch}) rotate(${-angle}deg)`;
  rafId=requestAnimationFrame(tick);
}
document.addEventListener('mousemove',e=>{
  tx=e.clientX;ty=e.clientY;
  if(!hasMouse){hasMouse=true;cx=e.clientX;cy=e.clientY;document.body.classList.add('has-mouse');cursor.classList.add('cursor-visible');tick();}
},{passive:true});
document.addEventListener('touchstart',()=>{if(rafId){cancelAnimationFrame(rafId);rafId=null;}document.body.classList.remove('has-mouse');cursor.style.display='none';},{passive:true,once:true});

document.querySelectorAll('a,.filter-reset,.nav-links a').forEach(el => {
  el.addEventListener('mouseenter', () => { if (!cursor.classList.contains('card-hover') && !cursor.classList.contains('filter-hover')) cursor.classList.add('hovering'); });
  el.addEventListener('mouseleave', () => cursor.classList.remove('hovering'));
});

/* Filter buttons get their own tiny cursor */
document.querySelectorAll('.filter-btn').forEach(el => {
  el.addEventListener('mouseenter', () => {
    cursor.classList.remove('hovering','card-hover');
    cursor.classList.add('filter-hover');
  });
  el.addEventListener('mouseleave', () => cursor.classList.remove('filter-hover'));
});



/* ══ SCROLL REVEAL ═══════════════════════════════════════════ */
const ro = new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
},{threshold:.08,rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('.reveal').forEach(el=>ro.observe(el));
</script>
